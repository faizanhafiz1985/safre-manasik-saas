version: '3.8'

# Production stack: PostgreSQL + Redis + Backend + Frontend (nginx) + Reverse Proxy
# Bring up with:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:

  postgres:
    image: postgres:16-alpine
    container_name: safre_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [safre_net]
    # No port exposed publicly — only via internal network
    # Uncomment for emergency direct access:
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    container_name: safre_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
    networks: [safre_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: safre/backend:${IMAGE_TAG:-latest}
    container_name: safre_backend
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-stub}
      MOYASAR_PUBLISHABLE_KEY: ${MOYASAR_PUBLISHABLE_KEY:-stub}
    volumes:
      - uploads:/app/uploads
      - backend_logs:/app/logs
    networks: [safre_net]
    # Internal only — exposed via reverse proxy
    # For debugging, uncomment:
    # ports: ["127.0.0.1:5000:5000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    image: safre/frontend:${IMAGE_TAG:-latest}
    container_name: safre_frontend
    restart: always
    depends_on: [backend]
    networks: [safre_net]
    # No public port — served via reverse proxy

  proxy:
    image: nginx:alpine
    container_name: safre_proxy
    restart: always
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/ssl:/etc/nginx/ssl:ro
      - proxy_logs:/var/log/nginx
    networks: [safre_net]

volumes:
  postgres_data:
  redis_data:
  uploads:
  backend_logs:
  proxy_logs:

networks:
  safre_net:
    driver: bridge
