<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A227;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B7A1A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left side: Illustration -->
  <!-- Outer arch/dome frame -->
  <path d="M15,185 L15,95 Q15,20 85,20 Q155,20 155,95 L155,185 Z"
        fill="none" stroke="url(#archGrad)" stroke-width="6" />
  <!-- Inner arch detail -->
  <path d="M25,185 L25,98 Q25,32 85,32 Q145,32 145,98 L145,185 Z"
        fill="none" stroke="url(#archGrad)" stroke-width="2.5" opacity="0.5"/>

  <!-- Dome finial top -->
  <polygon points="85,8 90,22 80,22" fill="url(#goldGrad)"/>
  <circle cx="85" cy="7" r="4" fill="url(#goldGrad)"/>

  <!-- Crescent moon on top -->
  <path d="M92,12 Q100,5 100,16 Q93,13 92,12Z" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="97" cy="10" r="2" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Kaaba (dark green cube) -->
  <rect x="60" y="100" width="50" height="52" rx="2" fill="#1B4B35"/>
  <!-- Kaaba door -->
  <rect x="78" y="118" width="14" height="20" rx="1" fill="#C9A227" opacity="0.8"/>
  <!-- Kaaba cloth line (Kiswah band) -->
  <rect x="60" y="108" width="50" height="8" fill="#C9A227" opacity="0.4"/>
  <!-- Kaaba top detail -->
  <rect x="60" y="100" width="50" height="4" rx="1" fill="#0D2B1A"/>

  <!-- Left minaret -->
  <rect x="22" y="70" width="10" height="85" rx="2" fill="#1B4B35"/>
  <polygon points="22,70 32,70 27,52" fill="#1B4B35"/>
  <circle cx="27" cy="51" r="4" fill="#C9A227"/>
  <rect x="20" y="95" width="14" height="5" rx="1" fill="#C9A227" opacity="0.5"/>

  <!-- Right minaret -->
  <rect x="138" y="70" width="10" height="85" rx="2" fill="#1B4B35"/>
  <polygon points="138,70 148,70 143,52" fill="#1B4B35"/>
  <circle cx="143" cy="51" r="4" fill="#C9A227"/>
  <rect x="136" y="95" width="14" height="5" rx="1" fill="#C9A227" opacity="0.5"/>

  <!-- Winding road/path -->
  <path d="M45,185 Q55,165 65,155 Q75,145 80,130" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M125,185 Q115,165 105,155 Q95,145 90,130" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Palm tree (left) -->
  <line x1="40" y1="152" x2="40" y2="132" stroke="#1B4B35" stroke-width="2.5"/>
  <path d="M40,133 Q33,125 28,127 Q34,132 35,135Z" fill="#1B4B35"/>
  <path d="M40,133 Q35,122 30,124 Q37,130 38,133Z" fill="#1B4B35"/>
  <path d="M40,133 Q47,122 52,125 Q45,130 43,133Z" fill="#1B4B35"/>
  <path d="M40,133 Q48,126 53,129 Q46,133 44,135Z" fill="#1B4B35"/>

  <!-- Mountains background -->
  <polygon points="30,158 50,135 70,158" fill="#1B4B35" opacity="0.3"/>
  <polygon points="55,158 78,128 100,158" fill="#1B4B35" opacity="0.25"/>
  <polygon points="90,158 115,138 140,158" fill="#1B4B35" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="38" cy="45" r="2" fill="#C9A227" opacity="0.8"/>
  <circle cx="130" cy="38" r="1.5" fill="#C9A227" opacity="0.8"/>
  <circle cx="50" cy="30" r="1.5" fill="#C9A227" opacity="0.6"/>
  <circle cx="118" cy="55" r="1.5" fill="#C9A227" opacity="0.6"/>

  <!-- Right side: Text -->
  <!-- "Safr" -->
  <text x="180" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#1B4B35" letter-spacing="-1">Safr</text>
  <!-- "e" in gold -->
  <text x="180" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#C9A227" letter-spacing="2">e</text>
  <!-- "Manasik" -->
  <text x="206" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1B4B35" letter-spacing="-0.5">Manasik</text>

  <!-- Gold divider line -->
  <line x1="180" y1="133" x2="510" y2="133" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>

  <!-- Diamond accent -->
  <polygon points="345,129 349,133 345,137 341,133" fill="#C9A227"/>

  <!-- Services tagline -->
  <text x="345" y="150" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1B4B35" text-anchor="middle" letter-spacing="1.5">UMRAH  •  HAJJ  •  TRAVEL  •  ZIARAAT  •  TOURS</text>

  <!-- Subtitle -->
  <text x="345" y="167" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#C9A227" text-anchor="middle" letter-spacing="0.5">Your Journey, Our Responsibility</text>

  <!-- Registered line -->
  <text x="345" y="182" font-family="Arial, sans-serif" font-size="8.5" fill="#5A7A65" text-anchor="middle">( Registered in KSA )   |   CR No. 7053347410</text>
</svg>
