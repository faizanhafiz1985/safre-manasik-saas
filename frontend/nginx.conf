server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route serves index.html (React Router handles the rest)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api/ when running locally with docker-compose
    # (Ignored on Railway — frontend talks to backend via REACT_APP_API_URL at build time)
    location /api/ {
        # Resolve at request time so missing upstream doesn't kill nginx at startup
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unreachable;
    }

    location @api_unreachable {
        return 502 '{"error":"backend unreachable from frontend proxy. on Railway, set REACT_APP_API_URL at build time."}';
        add_header Content-Type application/json always;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
