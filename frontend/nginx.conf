server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route serves index.html (React Router handles the rest)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ to the backend service.
    # On Railway, set BACKEND_URL env var to the backend service URL
    # (e.g. https://backend-production-XXXX.up.railway.app).
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        proxy_pass ${BACKEND_URL}$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-production-44fd.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
