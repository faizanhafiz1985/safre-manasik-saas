[build]
builder = "nixpacks"

[deploy]
# Schema changes are applied by src/bootstrap.js (raw ALTER ... IF NOT EXISTS
# on boot) — NOT by prisma db push. Do not add prisma CLI here: it is a
# devDependency and is not present in the production image (caused the
# 2026-07-05 crash-loop). Every new column MUST get a bootstrap ensure* guard.
startCommand = "node src/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
