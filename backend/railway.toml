[build]
builder = "nixpacks"

[deploy]
# Must apply the Prisma schema before boot — without this, deploys that add
# columns leave the DB behind the code (form_vouchers.customerId outage,
# 2026-07-05). Keep in sync with railway.json / Dockerfile CMD.
startCommand = "npx prisma db push --accept-data-loss && node src/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
